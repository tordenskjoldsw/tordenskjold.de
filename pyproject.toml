[project]
name = "portfolio"
version = "0.1.0"
description = "Personal portfolio website of Tobias Kaminski"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # bugbear
    "S",     # bandit
    "C4",    # comprehensions
    "SIM",   # simplify
    "RET",   # return
    "PTH",   # pathlib over os.path
    "PT",    # pytest style
    "T20",   # no print, logging only
    "ASYNC", # no blocking calls in async code
    "RUF",   # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
