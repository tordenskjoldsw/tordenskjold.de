# Installed as /etc/systemd/journald.conf.d/retention.conf.
#
# The privacy policy promises that error logs are deleted after 7 days.
# journald deletes whole archived files once their first entry is older
# than MaxRetentionSec, and starts a new file every day, so no entry is
# kept longer than about 7 days. This applies to all logs on the server.

[Journal]
MaxFileSec=1day
MaxRetentionSec=6day
