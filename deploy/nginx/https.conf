# Installed as /etc/nginx/conf.d/tordenskjold.de-https.conf once the
# certificate exists (see deploy/README.md).

# TLS connections for unknown hosts are refused during the handshake, so
# no certificate is shown to scanners.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.tordenskjold.de;
    include snippets/tordenskjold.de-tls.conf;

    return 301 https://tordenskjold.de$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tordenskjold.de;
    include snippets/tordenskjold.de-tls.conf;

    # Fonts and images are already compressed.
    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain application/xml application/atom+xml image/svg+xml;

    # The app sets the security and cache headers itself. The client
    # address is not forwarded because the app has no use for it.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
