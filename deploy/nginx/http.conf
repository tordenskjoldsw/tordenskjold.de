# Installed as /etc/nginx/conf.d/tordenskjold.de-http.conf. Files in
# conf.d are included inside the http block of the stock nginx.conf.

# The privacy policy promises that page views are not recorded and that
# error logs are deleted after 7 days. Errors go to the journal, whose
# retention is set in deploy/journald/retention.conf.
access_log off;
error_log syslog:server=unix:/dev/log,nohostname,tag=nginx error;

# Requests for unknown hosts or bare IP addresses get no response.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name tordenskjold.de www.tordenskjold.de;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://tordenskjold.de$request_uri;
    }
}
