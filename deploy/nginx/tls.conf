# Installed as /etc/nginx/snippets/tordenskjold.de-tls.conf and included in
# every TLS server. These are set per server because stock nginx.conf files
# often set some of them in the http block already, and repeating a
# directive on the same level is an error.

server_tokens off;
#
# Mozilla "intermediate" profile. No OCSP stapling: Let's Encrypt no longer
# runs an OCSP responder.

ssl_certificate /etc/letsencrypt/live/tordenskjold.de/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/tordenskjold.de/privkey.pem;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# No includeSubDomains: other names in the zone are not served over HTTPS
# by this server.
add_header Strict-Transport-Security "max-age=31536000" always;
