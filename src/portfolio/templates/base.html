<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}{% endblock %}</title>
    <meta name="description" content="{% block description %}{% endblock %}">
    <link rel="preload" href="{{ static_url('fonts/inter/Inter-Regular.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ static_url('css/tokens.css') }}">
    <link rel="stylesheet" href="{{ static_url('css/base.css') }}">
    {% if has_devlog %}
    <link rel="alternate" type="application/atom+xml" title="Devlog" href="/feed.xml">
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include "partials/header.html" %}
    <main id="main">
      {% block content %}{% endblock %}
    </main>
    {% include "partials/footer.html" %}
  </body>
</html>
